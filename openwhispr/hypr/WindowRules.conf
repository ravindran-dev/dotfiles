# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Hotspot/Rofi: keep rounded transparent corners free of blur.
layerrule = match:namespace rofi, ignore_alpha 0.5
layerrule = match:namespace rofi, blur

# OpenWhispr Rules
# Floating voice recorder pill:
# Keep borders, shadows, blur, and animations stripped.
# no_follow_mouse prevents hovering over the transparent outer bounding box from deactivating the current active window.
windowrulev2 = float, class:^(open-whispr)$, title:^(Voice Recorder)$
windowrulev2 = pin, class:^(open-whispr)$, title:^(Voice Recorder)$
windowrulev2 = noborder, class:^(open-whispr)$, title:^(Voice Recorder)$
windowrulev2 = noshadow, class:^(open-whispr)$, title:^(Voice Recorder)$
windowrulev2 = noblur, class:^(open-whispr)$, title:^(Voice Recorder)$
windowrulev2 = noanim, class:^(open-whispr)$, title:^(Voice Recorder)$
windowrulev2 = noinitialfocus, class:^(open-whispr)$, title:^(Voice Recorder)$
windowrulev2 = nofollowmouse on, class:^(open-whispr)$, title:^(Voice Recorder)$

windowrulev2 = float, class:^(open-whispr)$, title:^(Meeting Notification)$
windowrulev2 = pin, class:^(open-whispr)$, title:^(Meeting Notification)$
windowrulev2 = noborder, class:^(open-whispr)$, title:^(Meeting Notification)$
windowrulev2 = noshadow, class:^(open-whispr)$, title:^(Meeting Notification)$
windowrulev2 = noblur, class:^(open-whispr)$, title:^(Meeting Notification)$
windowrulev2 = noanim, class:^(open-whispr)$, title:^(Meeting Notification)$
windowrulev2 = noinitialfocus, class:^(open-whispr)$, title:^(Meeting Notification)$
windowrulev2 = nofollowmouse on, class:^(open-whispr)$, title:^(Meeting Notification)$

windowrulev2 = float, class:^(open-whispr)$, title:^(Control Panel)$
windowrulev2 = center, class:^(open-whispr)$, title:^(Control Panel)$
